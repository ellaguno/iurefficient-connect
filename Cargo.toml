[package]
name = "iurefficient-connect"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Shared connector between the Iurefficient desktop apps and Iurefficient instances: account, keyring, WebDAV, MCP, REST API and UI language."
repository = "https://github.com/ellaguno/iurefficient-connect"
readme = "README.md"
keywords = ["iurefficient", "webdav", "mcp", "tauri"]
categories = ["api-bindings"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: al escribir la configuración de un asistente (Claude Desktop) se
# conserva el orden de las claves del usuario.
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "multipart"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
futures-util = "0.3"
bytes = "1"
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
log = "0.4"
dirs = "6"
sys-locale = "0.3"

# Llavero del sistema (opcional): en Linux usa Secret Service por D-Bus, como IureDav.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
