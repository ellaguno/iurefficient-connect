[package]
name = "iurefficient-connect"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Conector común de las aplicaciones de escritorio con instancias de Iurefficient: cuenta, llavero, WebDAV, MCP y API REST."
repository = "https://github.com/ellaguno/iurefficient-connect"
readme = "README.md"
keywords = ["iurefficient", "webdav", "mcp", "tauri"]
categories = ["api-bindings"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "multipart"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
futures-util = "0.3"
bytes = "1"
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
log = "0.4"
dirs = "6"

# Llavero del sistema (opcional): en Linux usa Secret Service por D-Bus, como IureDav.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
